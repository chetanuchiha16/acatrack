name: Wake up Render & Supabase

on:
  schedule:
    - cron: "0 9 */3 * *"   # every 3 days
  workflow_dispatch:

jobs:
  wakeup:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render app
        run: |
          curl -s https://student-result-backend.onrender.com/health > /dev/null

      - name: Wake Supabase project
        run: |
          curl -s https://hpavqkjevepfegkojisn.supabase.co/rest/v1/ > /dev/null
